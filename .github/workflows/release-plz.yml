# Two-mode release automation driven by release-plz:
#   `release-pr` keeps a single release PR open against `main`, bumping
#   versions and prepending CHANGELOG sections as conventional commits
#   land;
#   `release` runs after the release PR is merged — it publishes the
#   crates in dependency order, tags, and creates the GitHub release.
#
# Authentication uses the `GH_TOKEN` PAT secret (not the workflow
# GITHUB_TOKEN) so the release PR triggers the regular CI checks.
# See `release-plz.toml` for per-package configuration and `RELEASE.md`
# for the human-facing flow.

name: Release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'RAprogramm' }}
    steps:
      # release-plz pushes the release branch through the git CLI, so the
      # credentials have to stay in the checkout. The job uploads no
      # artefacts, so there is nothing for them to leak into.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked]
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Run release-plz release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'RAprogramm' }}
    needs: release-plz-release
    steps:
      # release-plz pushes the release branch through the git CLI, so the
      # credentials have to stay in the checkout. The job uploads no
      # artefacts, so there is nothing for them to leak into.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked]
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Run release-plz release-pr
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
