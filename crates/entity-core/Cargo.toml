[package]
name = "entity-core"
version = "0.10.3"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Core traits and types for entity-derive"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/entity-core"
readme = "README.md"
keywords = ["entity", "repository", "traits", "database"]
categories = ["database"]

[features]
default = []
postgres = ["sqlx"]
clickhouse = []
mongodb = []
streams = ["serde", "serde_json", "futures"]
outbox = ["postgres", "serde_json", "dep:tokio", "sqlx/runtime-tokio", "sqlx/json"]
tracing = ["dep:tracing"]

[dependencies]
async-trait = "0.1"
sqlx = { version = "0.9", optional = true, default-features = false, features = [
  "postgres",
] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1", features = ["time"], optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
