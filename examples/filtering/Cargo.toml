[package]
name = "example-filtering"
version = "0.1.0"
edition = "2024"
publish = false
description = "Type-safe filtering example with entity-derive"

# Reached only through derives the macro emits — `serde::Serialize`
# on the DTOs, `utoipa::ToSchema` on the OpenAPI ones — which the
# unused-dependency heuristic cannot see.
[package.metadata.cargo-machete]
ignored = ["utoipa"]

[features]
default = ["postgres", "api"]
postgres = []
api = []
validate = []
tracing = []

[dependencies]
entity-derive = { path = "../../crates/entity-derive", features = ["postgres", "api"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
